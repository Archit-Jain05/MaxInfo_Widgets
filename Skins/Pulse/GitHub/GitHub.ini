; GitHub card: large (2x2 units). Last 13 weeks (~3 months) of public contributions for #User#,
; in GitHub green, with that span's total and best day, and the public repo count. Refreshed hourly from
; github.com (no token). Cells and numbers come from GitHub.lua.

[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!UpdateMeter Bg][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!UpdateMeter Bg][!Redraw]
LeftMouseDoubleClickAction=["https://github.com/#User#"]
ContextTitle=Open GitHub profile
ContextAction=["https://github.com/#User#"]

[Variables]
@Include=#@#Theme.inc
; your GitHub username
User=octocat
Total=Loading...
SpanTotal=
Streak=
Best=

[PageFetch]
Measure=WebParser
URL=https://github.com/users/#User#/contributions
RegExp=(?s)^(.*)$
CodePage=65001
UpdateRate=3600
FinishAction=[!CommandMeasure Graph "Build()"]

[Page]
Measure=WebParser
URL=[PageFetch]
StringIndex=1

; public repo count from the profile API (no token; private repos aren't counted)
[ProfileFetch]
Measure=WebParser
URL=https://api.github.com/users/#User#
RegExp=(?s)"public_repos":\s*(\d+)
UpdateRate=3600

[Repos]
Measure=WebParser
URL=[ProfileFetch]
StringIndex=1

[Graph]
Measure=Script
ScriptFile=#@#GitHub.lua

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((2*#Unit#+#Gap#)*#S#)
Height=((2*#Unit#+#Gap#)*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

[UserText]
Meter=String
Text=#User#
FontFace=#FontSemi#
FontSize=(8.5*#S#)
FontColor=#Ink#
X=(15*#S#)
Y=(11*#S#)
AntiAlias=1

[TotalText]
Meter=String
Text=#Total#
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Muted#
StringAlign=Right
X=(236*#S#)
Y=(12*#S#)
AntiAlias=1
DynamicVariables=1

; one Shape option per day, set by GitHub.lua
[Cells]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0

; that span's numbers
[Divider]
Meter=Shape
Shape=Line (18*#S#),(170*#S#),(234*#S#),(170*#S#) | StrokeWidth 1 | Stroke Color 255,255,255,16

[SpanTotalNum]
Meter=String
Text=#SpanTotal#
FontFace=#FontNumber#
FontSize=(17*#S#)
FontColor=#Ink#
StringAlign=Center
X=(42*#S#)
Y=(178*#S#)
AntiAlias=1
DynamicVariables=1

[SpanTotalLabel]
Meter=String
Text=contributions
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Muted#
StringAlign=Center
X=(42*#S#)
Y=(208*#S#)
AntiAlias=1

[StreakNum]
Meter=String
MeasureName=Repos
FontFace=#FontNumber#
FontSize=(17*#S#)
FontColor=#Ink#
StringAlign=Center
X=(126*#S#)
Y=(178*#S#)
AntiAlias=1
DynamicVariables=1

[StreakLabel]
Meter=String
Text=repos
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Muted#
StringAlign=Center
X=(126*#S#)
Y=(208*#S#)
AntiAlias=1

[BestNum]
Meter=String
Text=#Best#
FontFace=#FontNumber#
FontSize=(17*#S#)
FontColor=#Ink#
StringAlign=Center
X=(210*#S#)
Y=(178*#S#)
AntiAlias=1
DynamicVariables=1

[BestLabel]
Meter=String
Text=best day
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Muted#
StringAlign=Center
X=(210*#S#)
Y=(208*#S#)
AntiAlias=1