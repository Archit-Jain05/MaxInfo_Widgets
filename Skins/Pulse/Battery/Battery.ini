[S1Ring]
Meter=Shape
Group=S1
Container=Clip
Hidden=1
Shape=Path S1TrackPath | Fill Color 0,0,0,0 | StrokeWidth (4.5*#S#) | Stroke Color 255,255,255,#S1TA# | StrokeStartCap Round | StrokeEndCap Round
Shape2=Path S1ArcPath | Fill Color 0,0,0,0 | StrokeWidth (4.5*#S#) | Stroke Color #S1C#,#S1A# | StrokeStartCap Round | StrokeEndCap Round
S1TrackPath=#S1Track#
S1ArcPath=#S1Arc#
