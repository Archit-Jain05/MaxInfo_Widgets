[LaptopPct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT
UpdateDivider=#Tick#

[LaptopAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=#Tick#

[Devices]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=Devices
UpdateDivider=#Tick#

[Layout]
Measure=Script
ScriptFile=#@#Battery.lua

; Row slide at ~60 fps (10 ms waits = one 15.6 ms timer tick) while scrolling; Battery.lua's Frame() does the work.
[Anim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Frame,10,60
Frame=[!CommandMeasure Layout "Frame()"]

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((2*#Unit#+#Gap#)*#S#)
Height=(#Unit#*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

; Clips the outlines and tiles to the card while they slide between rows.
[Clip]
Meter=Shape
Shape=Path ClipShape | Fill Color 0,0,0,255 | StrokeWidth 0
ClipShape=#CardPath#
DynamicVariables=1

; ---- Empty-cell outlines (two rows of 4; Y follows the scroll, set by Battery.lua) ----
[C1Outline]
Meter=Shape
Container=Clip
Shape=Ellipse (38.25*#S#),#OY1#,(20*#S#) | Fill Color 0,0,0,0 | StrokeWidth (4.5*#S#) | Stroke Color 255,255,255,#C1PA#
DynamicVariables=1
[C2Outline]
Meter=Shape
Container=Clip
Shape=Ellipse (96.75*#S#),#OY1#,(20*#S#) | Fill Color 0,0,0,0 | StrokeWidth (4.5*#S#) | Stroke Color 255,255,255,#C2PA#
DynamicVariables=1
