; Battery card: wide (2 units + gap by 1 unit) with rows of 4 cells (scroll for the second row), filled in order: the laptop
; first, then devices in the order they connected (Bluetooth or Phone Link). When one leaves,
; later tiles slide left to fill the gap. Cells with no tile show an outline ring.
; Cell geometry (padding 12, cells 52.5 wide, gap 6, ring r20 centred on y = 49) is mirrored in Battery.lua.

[Rainmeter]
Update=33
SkinWidth=((2*#Unit#+#Gap#)*#S#)
SkinHeight=(#Unit#*#S#)
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!UpdateMeter Bg][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!UpdateMeter Bg][!Redraw]
MouseScrollUpAction=[!CommandMeasure Layout "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure Layout "Scroll(1)"]
LeftMouseDoubleClickAction=["ms-settings:bluetooth"]
ContextTitle=Bluetooth settings
ContextAction=["ms-settings:bluetooth"]

