; ---- Row dots on the right edge, shown only when there's a second row ----
[Dots]
Meter=Shape
Shape=Ellipse (245*#S#),(55*#S#),(1.75*#S#) | Fill Color 255,255,255,#D1A# | StrokeWidth 0
Shape2=Ellipse (245*#S#),(65*#S#),(1.75*#S#) | Fill Color 255,255,255,#D2A# | StrokeWidth 0
DynamicVariables=1
