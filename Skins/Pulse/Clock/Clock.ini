; Desktop clock in the macOS lock-screen style: a date line over a large bold time, soft white,
; no card. 12-hour without a leading zero or AM/PM, like the Mac. Centred on its X position.
; Fonts are named by face ("SF Pro Display Bold"): by family + weight, Rainmeter picks this install's italics.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
LeftMouseDoubleClickAction=["ms-clock:"]
ContextTitle=Open Clock
ContextAction=["ms-clock:"]

[Variables]
; No Theme.inc: it turns on the blur behind the window, and this clock floats on the wallpaper.
; Keep S in step with Theme.inc.
S=1.25
; Soft white, slightly see-through like macOS vibrancy.
Face=255,255,255,215
DateFace=255,255,255,200
Width=(640*#S#)

[Date]
Measure=Time
Format=%A %#d %B

[Time]
Measure=Time
Format=%#I:%M

[DateText]
Meter=String
MeasureName=Date
FontFace=SF Pro Display Medium
FontSize=(17*#S#)
FontColor=#DateFace#
StringAlign=Center
X=(#Width#/2)
Y=0
InlineSetting=Shadow | 0 | 1 | 6 | 0,0,0,70
AntiAlias=1

[TimeText]
Meter=String
MeasureName=Time
FontFace=SF Pro Display Bold
FontSize=(92*#S#)
FontColor=#Face#
StringAlign=Center
X=(#Width#/2)
Y=(18*#S#)
InlineSetting=CharacterSpacing | 0 | -6
InlineSetting2=Shadow | 0 | 2 | 12 | 0,0,0,70
AntiAlias=1

; Keeps the window a fixed width so the clock stays centred as digits change.
[Span]
Meter=Shape
Shape=Rectangle 0,0,#Width#,1 | Fill Color 0,0,0,1 | StrokeWidth 0
