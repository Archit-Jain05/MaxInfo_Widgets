; To Do card: wide (2 units + gap by 1 unit), laid out like the calendar. Left: the list name (accent),
; its open tasks in big type and a muted line under it (how old the data is, when over a day).
; Right: that list's tasks as a continuous list (4 visible, one row per wheel notch, thin scrollbar),
; each with a check circle, the title and its due date (blue today, red overdue; a yellow star when
; important). 6 row slots are recycled as the list scrolls. Click the left side to pick another list
; inside the card; click a task to open To Do. Read by PulseTemps from the To Do app's own database,
; so it's as fresh as the app's last sync. Logic in ToDo.lua.
[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=((2*#Unit#+#Gap#)*#S#)
SkinHeight=(#Unit#*#S#)
OnRefreshAction=[!SetTransparency #Opacity#]
; clicking anywhere else (the card loses focus) closes the list picker
OnUnfocusAction=[!CommandMeasure Board "Close()"]
MouseScrollUpAction=[!CommandMeasure Board "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure Board "Scroll(1)"]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!UpdateMeter Bg][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!UpdateMeter Bg][!Redraw]

[Variables]
@Include=#@#Theme.inc
; the list shown (its To Do id; empty = the default Tasks list), saved by ToDo.lua
ListId=
Title=To Do
Big=
Sub=
Accent=10,132,255
TitleColor=10,132,255
BarA=0
BarY=0
BarH=0
T1=
TW1=150
R1=
RC1=150,155,164
CF1=0,0,0,0
A1=0
LA1=0
HA1=0
Y1=0
T2=
TW2=150
R2=
RC2=150,155,164
CF2=0,0,0,0
A2=0
LA2=0
HA2=0
Y2=0
T3=
TW3=150
R3=
RC3=150,155,164
CF3=0,0,0,0
A3=0
LA3=0
HA3=0
Y3=0
T4=
TW4=150
R4=
RC4=150,155,164
CF4=0,0,0,0
A4=0
LA4=0
HA4=0
Y4=0
T5=
TW5=150
R5=
RC5=150,155,164
CF5=0,0,0,0
A5=0
LA5=0
HA5=0
Y5=0
T6=
TW6=150
R6=
RC6=150,155,164
CF6=0,0,0,0
A6=0
LA6=0
HA6=0
Y6=0

[Tasks]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ToDo

[Lists]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ToDoLists

[Synced]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ToDoSynced

[Board]
Measure=Script
ScriptFile=#@#ToDo.lua

; Scroll glide at ~60 fps (10 ms waits = one 15.6 ms timer tick); ToDo.lua's Frame() does the work.
[Anim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Frame,10,60
Frame=[!CommandMeasure Board "Frame()"]

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((2*#Unit#+#Gap#)*#S#)
Height=(#Unit#*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

; ---- Left side (same type as the calendar's date): click anywhere on it to pick a list ----
[PickHit]
Meter=Shape
Shape=Rectangle 0,0,(94*#S#),(120*#S#) | Fill Color 255,255,255,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure Board "Pick()"]
MouseOverAction=[!SetVariable TitleColor "#Ink#"][!UpdateMeter Label][!Redraw]
MouseLeaveAction=[!SetVariable TitleColor "#Accent#"][!UpdateMeter Label][!Redraw]

[Label]
Meter=String
Text=#Title#
FontFace=#FontSemi#
FontSize=(8*#S#)
FontColor=#TitleColor#
X=(14*#S#)
Y=(12*#S#)
W=(78*#S#)
ClipString=1
InlineSetting=Size | (6*#S#)
InlinePattern=[\x{25BE}\x{25B4}]
AntiAlias=1
DynamicVariables=1

[BigText]
Meter=String
Text=#Big#
FontFace=#FontNumber#
FontSize=(36*#S#)
FontColor=#Ink#
X=(10*#S#)
Y=(23.1*#S#)
InlineSetting=CharacterSpacing | 0 | -3
AntiAlias=1
DynamicVariables=1

[SubText]
Meter=String
Text=#Sub#
FontFace=#Font#
FontSize=(8*#S#)
FontColor=#Muted#
X=(14*#S#)
Y=(90*#S#)
W=(80*#S#)
ClipString=1
AntiAlias=1
DynamicVariables=1

; Thin scrollbar on the right edge, shown only when the list is longer than what fits.
[Bar]
Meter=Shape
Shape=Rectangle (244*#S#),#BarY#,(2.5*#S#),#BarH#,(1.25*#S#) | Fill Color 255,255,255,#BarA# | StrokeWidth 0
DynamicVariables=1

; ---- Right side: the rows, clipped to this area; its alpha fades the rows in and out at the top and bottom edges ----
[List]
Meter=Shape
Shape=Rectangle (96*#S#),(9*#S#),(147*#S#),(102*#S#) | Fill LinearGradient Fade | StrokeWidth 0
Fade=90 | 0,0,0,0 ; 0.0 | 0,0,0,255 ; 0.07 | 0,0,0,255 ; 0.93 | 0,0,0,0 ; 1.0

; ---- slot 1 (the hover pill takes the clicks; the text meters have no mouse actions, so they don't block it) ----
[H1]
Meter=Shape
Container=List
Shape=Rectangle (98*#S#),(#Y1#-4.5*#S#),(144*#S#),(21*#S#),(6*#S#) | Fill Color 255,255,255,#HA1# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure Board "Click(1)"]
MouseOverAction=[!SetVariable HA1 "(#A1#>0 ? 14 : 0)"][!UpdateMeter H1][!Redraw]
MouseLeaveAction=[!SetVariable HA1 0][!UpdateMeter H1][!Redraw]
DynamicVariables=1

[L1]
Meter=Shape
Container=List
Shape=Rectangle (118*#S#),(#Y1#-5.5*#S#),(120*#S#),(0.75*#S#) | Fill Color 255,255,255,#LA1# | StrokeWidth 0
DynamicVariables=1

[C1]
Meter=Shape
Container=List
Shape=Ellipse (108*#S#),(#Y1#+6*#S#),(4.75*#S#) | Fill Color #CF1# | StrokeWidth (1.4*#S#) | Stroke Color 150,155,164,#A1#
DynamicVariables=1

[T1]
Meter=String
Container=List
Text=#T1#
FontFace=#Font#
FontSize=(8*#S#)
FontColor=237,238,240,#A1#
X=(118*#S#)
Y=#Y1#
W=#TW1#
ClipString=1
AntiAlias=1
DynamicVariables=1

[R1]
