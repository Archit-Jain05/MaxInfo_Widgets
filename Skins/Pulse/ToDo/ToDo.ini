Container=List
Text=#R1#
FontFace=#FontSemi#
FontSize=(7*#S#)
FontColor=#RC1#,#A1#
StringAlign=Right
X=(238*#S#)
Y=(#Y1#+1*#S#)
InlineSetting=Color | 255,204,0,#A1#
