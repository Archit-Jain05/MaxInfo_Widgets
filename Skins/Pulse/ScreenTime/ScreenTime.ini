; Screen time card: wide (2 units + gap by 1 unit). Today's total, usage by hour and a stacked
; bar of the top apps, tracked locally by PulseTemps (foreground app every 2 s, not while idle
; 5+ min). Logic in ScreenTime.lua.

[Rainmeter]
Update=2000
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#]
; Click opens the detail card in the centre; clicking anywhere else (this card loses focus) hides it.
LeftMouseUpAction=[!SetWindowPosition "50%" "50%" "50%" "50%" "Pulse\ScreenTimeDetail"][!ZPos 1 "Pulse\ScreenTimeDetail"][!ShowFade "Pulse\ScreenTimeDetail"]
OnUnfocusAction=[!HideFade "Pulse\ScreenTimeDetail"]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!UpdateMeter Bg][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!UpdateMeter Bg][!Redraw]

[Variables]
@Include=#@#Theme.inc
TotalText=0m
App1=
Time1=
Dot1=0,0,0,0
App2=
Time2=
Dot2=0,0,0,0
App3=
Time3=
Dot3=0,0,0,0

[Total]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ScreenTotal

[Hours]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ScreenHours

[Apps]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ScreenApps

[Usage]
Measure=Script
ScriptFile=#@#ScreenTime.lua

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((2*#Unit#+#Gap#)*#S#)
Height=(#Unit#*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

[Label]
Meter=String
Text=Screen time
FontFace=#FontSemi#
FontSize=(8*#S#)
FontColor=#Muted#
X=(14*#S#)
Y=(12*#S#)
AntiAlias=1

[TotalNum]
Meter=String
Text=#TotalText#
FontFace=#FontNumber#
FontSize=(20*#S#)
FontColor=#Ink#
X=(12*#S#)
Y=(25*#S#)
InlineSetting=CharacterSpacing | 0 | -1
AntiAlias=1
DynamicVariables=1

; 24 hourly bars and the stacked app bar, one Shape option each, set by ScreenTime.lua
[Bars]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0

[Stack]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0

[Dot1]
Meter=Shape
Shape=Ellipse (17*#S#),(88.5*#S#),(2.5*#S#) | Fill Color #Dot1# | StrokeWidth 0
DynamicVariables=1

[App1Name]
Meter=String
Text=#App1#
FontFace=#FontSemi#
FontSize=(7.5*#S#)
FontColor=#Ink#
X=(23*#S#)
Y=(82*#S#)
W=(64*#S#)
ClipString=1
AntiAlias=1
DynamicVariables=1

[App1Time]
Meter=String
Text=#Time1#
FontFace=#Font#
FontSize=(7*#S#)
FontColor=#Muted#
X=(23*#S#)
Y=(96*#S#)
AntiAlias=1
DynamicVariables=1
[Dot2]
Meter=Shape
Shape=Ellipse (92*#S#),(88.5*#S#),(2.5*#S#) | Fill Color #Dot2# | StrokeWidth 0
DynamicVariables=1

[App2Name]
Meter=String
Text=#App2#
FontFace=#FontSemi#
FontSize=(7.5*#S#)
FontColor=#Ink#
X=(98*#S#)
Y=(82*#S#)
W=(64*#S#)
ClipString=1
AntiAlias=1
DynamicVariables=1

[App2Time]
Meter=String
Text=#Time2#
FontFace=#Font#
FontSize=(7*#S#)
FontColor=#Muted#
X=(98*#S#)
Y=(96*#S#)
AntiAlias=1
DynamicVariables=1
[Dot3]
Meter=Shape
Shape=Ellipse (167*#S#),(88.5*#S#),(2.5*#S#) | Fill Color #Dot3# | StrokeWidth 0
DynamicVariables=1

[App3Name]
Meter=String
Text=#App3#
FontFace=#FontSemi#
FontSize=(7.5*#S#)
FontColor=#Ink#
X=(173*#S#)
Y=(82*#S#)
W=(64*#S#)
ClipString=1
AntiAlias=1
DynamicVariables=1

[App3Time]
Meter=String
Text=#Time3#
FontFace=#Font#
FontSize=(7*#S#)
FontColor=#Muted#
X=(173*#S#)
Y=(96*#S#)
AntiAlias=1
DynamicVariables=1

