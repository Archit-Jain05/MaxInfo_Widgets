; Screen time detail: a 3x3-unit card opened in the centre of the screen by clicking the screen
; time card, and hidden again when you click anywhere else (handled by that card). Today's
; total and comparison, usage by hour, the last 7 days and the most used apps. ScreenDetail.lua.

[Rainmeter]
Update=2000
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#][!SetWindowPosition "50%" "50%" "50%" "50%"][!Hide]

[Variables]
@Include=#@#Theme.inc
; Mostly solid: this card opens over windows, not just the wallpaper.
Ground=0,0,0,242
Opacity=255
TotalText=0m
DateText=
CompareText=
App1=
Time1=
Share1=0
Track1=0
App2=
Time2=
Share2=0
Track2=0
App3=
Time3=
Share3=0
Track3=0
App4=
Time4=
Share4=0
Track4=0
App5=
Time5=
Share5=0
Track5=0
App6=
Time6=
Share6=0
Track6=0
App7=
Time7=
Share7=0
Track7=0
App8=
Time8=
Share8=0
Track8=0
Day1=
Day2=
Day3=
Day4=
Day5=
Day6=
Day7=

[Total]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ScreenTotal

[Hours]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ScreenHours

[Apps]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ScreenApps

[Week]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=ScreenWeek

[Detail]
Measure=Script
ScriptFile=#@#ScreenDetail.lua

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((3*#Unit#+2*#Gap#)*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

[Label]
Meter=String
Text=Screen time
FontFace=#FontSemi#
FontSize=(8.5*#S#)
FontColor=#Muted#
X=(20*#S#)
Y=(18*#S#)
AntiAlias=1
DynamicVariables=1

[DateLabel]
Meter=String
Text=#DateText#
FontFace=#Font#
FontSize=(8*#S#)
FontColor=#Muted#
X=(364*#S#)
Y=(18*#S#)
StringAlign=Right
AntiAlias=1
DynamicVariables=1

[TotalNum]
Meter=String
Text=#TotalText#
FontFace=#FontNumber#
FontSize=(30*#S#)
FontColor=#Ink#
X=(18*#S#)
Y=(34*#S#)
InlineSetting=CharacterSpacing | 0 | -1
AntiAlias=1
DynamicVariables=1

[Compare]
Meter=String
Text=#CompareText#
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Muted#
X=(20*#S#)
Y=(82*#S#)
AntiAlias=1
DynamicVariables=1

[HourHead]
Meter=String
Text=Today by hour
FontFace=#FontSemi#
FontSize=(7.5*#S#)
FontColor=#Muted#
X=(20*#S#)
Y=(106*#S#)
AntiAlias=1
DynamicVariables=1


