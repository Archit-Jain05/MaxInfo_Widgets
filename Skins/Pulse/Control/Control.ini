MouseOverAction=[!SetVariable B1H 26][!UpdateMeter B1Bg][!Redraw]
MouseLeaveAction=[!SetVariable B1H 0][!UpdateMeter B1Bg][!Redraw]
LeftMouseUpAction=[!CommandMeasure Bar "Open(1)"]
