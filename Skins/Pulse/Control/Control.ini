; Control bar: a compact row replacing the Command Palette dock. Half a grid unit tall. Clicking power plan, Legion mode,
; Temp files or Galaxy Buds swaps the row for that item's options in the same card; clicking
; anywhere else (the skin loses focus) or the highlighted icon brings the row back. Quick Share and
; Command Palette launch directly. Logos are white versions in @Resources\Icons. Logic: ControlBar.lua.

[Rainmeter]
Update=1000
AccurateText=1
; Fixed to the card: the sliding animation layers must not widen the window (the blur fills it).
SkinWidth=((2*#Unit#+#Gap#)*#S#)
SkinHeight=((#Unit#-#Gap#)/2*#S#)
OnRefreshAction=[!SetTransparency #Opacity#]
OnUnfocusAction=[!CommandMeasure Bar "Collapse()"]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!UpdateMeter Bg][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!UpdateMeter Bg][!Redraw]

[Variables]
@Include=#@#Theme.inc
B1H=0
B2H=0
B3H=0
B4H=0
B5H=0
P1Fill=255,255,255,16
P1Text=237,238,240
P2Fill=255,255,255,16
P2Text=237,238,240
P3Fill=255,255,255,16
P3Text=237,238,240
L1Fill=255,255,255,16
L1Text=237,238,240
L2Fill=255,255,255,16
L2Text=237,238,240
L3Fill=255,255,255,16
L3Text=237,238,240
tempPillA=225
IconA=255
IconDX=0
SecA=0
SecDX=18
budsPillA=225
TempText=
BudsText=

[ActivePlan]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes
RegValue=ActivePowerScheme

[LegionMode]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=LegionMode

[TempBytes]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=TempBytes

[TempFreed]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=TempFreed

[TempBusy]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=TempBusy

[Devices]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=Devices

; ~200 ms open/close animation; runs only while animating.
[Anim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Frame, 16, 13
Frame=[!CommandMeasure Bar "Frame()"]

[Bar]
Measure=Script
ScriptFile=#@#ControlBar.lua

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((2*#Unit#+#Gap#)*#S#)
Height=((#Unit#-#Gap#)/2*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

; The icon row and the options live in these containers; their alpha and x offset are animated
; by ControlBar.lua (ActionTimer below) when an item opens or closes.
[IconBox]
Meter=Shape
X=(#IconDX#*#S#)
Shape=Rectangle 0,0,((2*#Unit#+#Gap#)*#S#),((#Unit#-#Gap#)/2*#S#) | Fill Color 255,255,255,#IconA# | StrokeWidth 0
DynamicVariables=1

[SecBox]
Meter=Shape
X=(#SecDX#*#S#)
Shape=Rectangle 0,0,((2*#Unit#+#Gap#)*#S#),((#Unit#-#Gap#)/2*#S#) | Fill Color 255,255,255,#SecA# | StrokeWidth 0
DynamicVariables=1

