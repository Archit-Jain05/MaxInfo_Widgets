; Weather card: current temperature, condition and today's high/low from Open-Meteo (no key)
; for the laptop's location (Windows Location via PulseTemps). Fetches every 15 minutes.
; Hover shows feels-like and humidity.

[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!HideMeter Condition][!ShowMeter Feels][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!ShowMeter Condition][!HideMeter Feels][!UpdateMeter *][!Redraw]
LeftMouseDoubleClickAction=["msnweather:"]
ContextTitle=Open Weather
ContextAction=["msnweather:"]

[Variables]
@Include=#@#Theme.inc
; Coordinates the forecast is fetched for; Weather.lua rewrites this file when the laptop moves.
@Include2=#@#Location.inc
; Place name shown on the card.
City=Mumbai
Rain=10,132,255
WxText=Updating
WxMain=[\xE706]
WxMainY=27
WxBadge=
WxBadgeFont=Segoe Fluent Icons
WxBadgeX=93
WxBadgeY=38
WxDropsA=0
WxFogA=0

[GeoLat]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=Lat

[GeoLon]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=Lon

[Weather]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Lat#&longitude=#Lon#&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1
RegExp=(?siU)"current":\{.*"temperature_2m":(.*),"apparent_temperature":(.*),"relative_humidity_2m":(.*),"weather_code":(.*),"is_day":(.*)\}.*"temperature_2m_max":\[(.*)\].*"temperature_2m_min":\[(.*)\]
UpdateRate=900

[Temp]
Measure=WebParser
URL=[Weather]
StringIndex=1

[FeelsLike]
Measure=WebParser
URL=[Weather]
StringIndex=2

[Humidity]
Measure=WebParser
URL=[Weather]
StringIndex=3

[Code]
Measure=WebParser
URL=[Weather]
StringIndex=4

[IsDay]
Measure=WebParser
URL=[Weather]
StringIndex=5

[High]
Measure=WebParser
URL=[Weather]
StringIndex=6

[Low]
Measure=WebParser
URL=[Weather]
StringIndex=7

; Downloaded values are text; these round them for display.
[TempR]
Measure=Calc
Formula=Round(Temp)

[FeelsLikeR]
Measure=Calc
Formula=Round(FeelsLike)

[HumidityR]
Measure=Calc
Formula=Round(Humidity)

[HighR]
Measure=Calc
Formula=Round(High)

[LowR]
Measure=Calc
Formula=Round(Low)

[Icon]
Measure=Script
ScriptFile=#@#Weather.lua

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=(#Unit#*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

[Label]
Meter=String
Text=#City#
FontFace=#FontSemi#
FontSize=(8*#S#)
FontColor=#Muted#
X=(14*#S#)
Y=(12*#S#)
W=(66*#S#)
ClipString=1
AntiAlias=1

; ---- Icon, composed in Weather.lua ----
[WxBadge]
Meter=String
Text=#WxBadge#
FontFace=#WxBadgeFont#
FontSize=(9*#S#)
FontColor=#Ink#
StringAlign=CenterCenter
X=(#WxBadgeX#*#S#)
Y=(#WxBadgeY#*#S#)
AntiAlias=1
DynamicVariables=1

[WxMain]
Meter=String
Text=#WxMain#
FontFace=Segoe Fluent Icons
FontSize=(18*#S#)
FontColor=#Ink#
StringAlign=CenterCenter
X=(93*#S#)
Y=(#WxMainY#*#S#)
AntiAlias=1
DynamicVariables=1

[WxDrops]
Meter=Shape
Shape=Line (87*#S#),(35*#S#),(85*#S#),(41*#S#) | StrokeWidth (1.6*#S#) | Stroke Color #Rain#,#WxDropsA# | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line (93*#S#),(35*#S#),(91*#S#),(41*#S#) | StrokeWidth (1.6*#S#) | Stroke Color #Rain#,#WxDropsA# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line (99*#S#),(35*#S#),(97*#S#),(41*#S#) | StrokeWidth (1.6*#S#) | Stroke Color #Rain#,#WxDropsA# | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1

[WxFog]
Meter=Shape
Shape=Line (84*#S#),(36*#S#),(102*#S#),(36*#S#) | StrokeWidth (1.6*#S#) | Stroke Color #Muted#,#WxFogA# | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line (87*#S#),(40*#S#),(99*#S#),(40*#S#) | StrokeWidth (1.6*#S#) | Stroke Color #Muted#,#WxFogA# | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1

[TempText]
Meter=String
MeasureName=TempR
NumOfDecimals=0
Text=%1°
FontFace=#FontNumber#
FontSize=(26*#S#)
FontColor=#Ink#
X=(11*#S#)
Y=(25.6*#S#)
InlineSetting=CharacterSpacing | 0 | -2
AntiAlias=1

[Condition]
Meter=String
Text=#WxText#
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Muted#
X=(14*#S#)
Y=(70*#S#)
W=(92*#S#)
ClipString=1
AntiAlias=1
DynamicVariables=1

[Feels]
Meter=String
MeasureName=FeelsLikeR
MeasureName2=HumidityR
NumOfDecimals=0
Text=Feels %1° · %2%
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Ink#
X=(14*#S#)
Y=(70*#S#)
W=(92*#S#)
ClipString=1
AntiAlias=1
Hidden=1

[HighLow]
Meter=String
MeasureName=HighR
MeasureName2=LowR
NumOfDecimals=0
Text=H %1°   L %2°
FontFace=#FontSemi#
FontSize=(8*#S#)
FontColor=#Ink#
X=(14*#S#)
Y=(90*#S#)
InlineSetting=Color | #Muted#
InlinePattern=[HL]
AntiAlias=1
