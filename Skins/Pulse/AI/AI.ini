; AI limits card: large (2x2 units). One row per Claude account (cswap) plus Codex, each with a
; 5-hour and a weekly ring. Hover shows time until each limit resets. Logic in AILimits.lua.

[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!SetVariable WinA 255][!SetVariable LeftA 0][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!SetVariable WinA 0][!SetVariable LeftA 255][!UpdateMeter *][!Redraw]

[Variables]
@Include=#@#Theme.inc
Rows=1
; Under each ring: time until reset; hover cross-fades it to the reset clock time.
WinA=0
LeftA=255
R1AClock=
R1BClock=
R2AClock=
R2BClock=
R3AClock=
R3BClock=
R4AClock=
R4BClock=
R1CY=0
R1SepA=0
R1Name=
R1Acct=
R1AArc=0,0 | ArcTo 1,0,1,1,0,0,0
R1AC=10,132,255
R1AAA=0
R1APct=
R1ALeft=
R1BArc=0,0 | ArcTo 1,0,1,1,0,0,0
R1BC=10,132,255
R1BAA=0
R1BPct=
R1BLeft=
R2CY=0
R2SepA=0
R2Name=
R2Acct=
R2AArc=0,0 | ArcTo 1,0,1,1,0,0,0
R2AC=10,132,255
R2AAA=0
R2APct=
R2ALeft=
R2BArc=0,0 | ArcTo 1,0,1,1,0,0,0
R2BC=10,132,255
R2BAA=0
R2BPct=
R2BLeft=
R3CY=0
R3SepA=0
R3Name=
R3Acct=
R3AArc=0,0 | ArcTo 1,0,1,1,0,0,0
R3AC=10,132,255
R3AAA=0
R3APct=
R3ALeft=
R3BArc=0,0 | ArcTo 1,0,1,1,0,0,0
R3BC=10,132,255
R3BAA=0
R3BPct=
R3BLeft=
R4CY=0
R4SepA=0
R4Name=
R4Acct=
R4AArc=0,0 | ArcTo 1,0,1,1,0,0,0
R4AC=10,132,255
R4AAA=0
R4APct=
R4ALeft=
R4BArc=0,0 | ArcTo 1,0,1,1,0,0,0
R4BC=10,132,255
R4BAA=0
R4BPct=
R4BLeft=

[CSwap]
Measure=Plugin
Plugin=RunCommand
Program=cswap
Parameter=list --json
State=Hide
OutputType=UTF8
Timeout=20000

[CodexFive]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=CodexFive

[CodexFiveReset]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=CodexFiveReset

[CodexWeek]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=CodexWeek

[CodexWeekReset]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Pulse
RegValue=CodexWeekReset

[Limits]
Measure=Script
ScriptFile=#@#AILimits.lua
OnChangeAction=[!SetVariable Rows [Limits]][!UpdateMeter *][!Redraw]

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((2*#Unit#+#Gap#)*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

[HeadFive]
Meter=String
Text=5-hour
FontFace=#FontSemi#
FontSize=(7.5*#S#)
FontColor=#Muted#
StringAlign=CenterCenter
X=(160*#S#)
Y=(15*#S#)
AntiAlias=1

[HeadWeek]
Meter=String
Text=Weekly
FontFace=#FontSemi#
FontSize=(7.5*#S#)
FontColor=#Muted#
StringAlign=CenterCenter
X=(214*#S#)
Y=(15*#S#)
AntiAlias=1
; ---- Row 1 ----
[R1Sep]
Meter=Shape
Group=R1
Hidden=1
Shape=Line (16*#S#),((#R1CY#-(214/#Rows#)/2)*#S#),(236*#S#),((#R1CY#-(214/#Rows#)/2)*#S#) | StrokeWidth 1 | Stroke Color 255,255,255,#R1SepA#
DynamicVariables=1

[R1Name]
Meter=String
Group=R1
Hidden=1
Text=#R1Name#
FontFace=#FontSemi#
FontSize=(10.5*#S#)
FontColor=#Ink#
X=(16*#S#)
Y=((#R1CY#-18)*#S#)
AntiAlias=1
DynamicVariables=1

[R1Acct]
Meter=String
Group=R1
Hidden=1
Text=#R1Acct#
FontFace=#Font#
FontSize=(8.5*#S#)
FontColor=#Muted#
X=(16*#S#)
Y=((#R1CY#+2)*#S#)
W=(116*#S#)
ClipString=1
InlineSetting=Color | 10,132,255
InlinePattern=^●
AntiAlias=1
DynamicVariables=1

[R1ARing]
Meter=Shape
Group=R1
Hidden=1
Shape=Ellipse (160*#S#),((#R1CY#-5)*#S#),(19*#S#) | Fill Color 0,0,0,0 | StrokeWidth (5*#S#) | Stroke Color 255,255,255,26
Shape2=Path R1AArcPath | Fill Color 0,0,0,0 | StrokeWidth (5*#S#) | Stroke Color #R1AC#,#R1AAA# | StrokeStartCap Round | StrokeEndCap Round
R1AArcPath=#R1AArc#
DynamicVariables=1

