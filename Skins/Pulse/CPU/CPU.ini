[Variables]
Label=CPU
@Include=#@#Card.inc
TempKey=CpuTemp
@Include2=#@#Temp.inc

[Pct]
Measure=CPU
MinValue=0
MaxValue=100
AverageSize=2
UpdateDivider=#Tick#

[Model]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
UpdateDivider=-1
RegExpSubstitute=1
Substitute="^.*?((?:i\d|Ultra \d)[- ]\w+|Ryzen \d \w+).*$":"\1"

[DetailText]
Measure=String
String=[Model]
DynamicVariables=1
UpdateDivider=-1

[TopProc]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
UpdateDivider=#Tick#

[TopText]
Measure=String
String=[TopProc:0]% · [TopProc]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^.* · $":"Nothing busy"
UpdateDivider=#Tick#
