; Network card: download (large, accent) and upload (small, muted) on the active connection,
; with a shared-scale history graph. Same shell as the other cards; updates once a second.

[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!HideMeterGroup Up][!ShowMeter IP][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!ShowMeterGroup Up][!HideMeter IP][!UpdateMeter *][!Redraw]
LeftMouseDoubleClickAction=["ms-settings:network-status"]
ContextTitle=Network settings
ContextAction=["ms-settings:network-status"]

[Variables]
@Include=#@#Theme.inc
Accent=10,132,255

[Down]
Measure=NetIn
Interface=Best

[Up]
Measure=NetOut
Interface=Best

[IPAddress]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=(#Unit#*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

[Label]
Meter=String
Text=Network
FontFace=#FontSemi#
FontSize=(8*#S#)
FontColor=#Muted#
X=(14*#S#)
Y=(12*#S#)
AntiAlias=1

[DownIcon]
Meter=String
Text=[\xE74B]
FontFace=Segoe Fluent Icons
FontSize=(9*#S#)
FontColor=#Accent#
X=(14*#S#)
Y=(36*#S#)
AntiAlias=1

[DownText]
Meter=String
MeasureName=Down
AutoScale=1
NumOfDecimals=1
Text=%1B/s
FontFace=#FontNumber#
FontSize=(17*#S#)
FontColor=#Ink#
X=(28*#S#)
Y=(28.6*#S#)
InlineSetting=CharacterSpacing | 0 | -1
InlineSetting2=Size | 10
InlinePattern2=[kMGT]?B/s$
InlineSetting3=Color | #Muted#
InlinePattern3=[kMGT]?B/s$
AntiAlias=1

[UpIcon]
Meter=String
Group=Up
Text=[\xE74A]
FontFace=Segoe Fluent Icons
FontSize=(8*#S#)
FontColor=#Muted#
X=(14*#S#)
Y=(64*#S#)
AntiAlias=1

[UpText]
Meter=String
Group=Up
MeasureName=Up
AutoScale=1
NumOfDecimals=1
Text=%1B/s
FontFace=#FontSemi#
FontSize=(9*#S#)
FontColor=#Ink#
X=(28*#S#)
Y=(61*#S#)
InlineSetting=Color | #Muted#
InlinePattern=[kMGT]?B/s$
AntiAlias=1

[IP]
Meter=String
MeasureName=IPAddress
Text=IP %1
FontFace=#Font#
FontSize=(7.5*#S#)
FontColor=#Ink#
X=(14*#S#)
Y=(63*#S#)
AntiAlias=1
Hidden=1

[Fill]
Meter=Histogram
MeasureName=Down
X=(14*#S#)
Y=(88*#S#)
W=(92*#S#)
H=(18*#S#)
AutoScale=1
PrimaryColor=#Accent#,34
SolidColor=0,0,0,0
AntiAlias=1

[Lines]
Meter=Line
MeasureName=Down
MeasureName2=Up
X=(14*#S#)
Y=(88*#S#)
W=(92*#S#)
H=(18*#S#)
LineCount=2
AutoScale=1
LineColor=#Accent#
LineColor2=#Muted#
LineWidth=(1.5*#S#)
AntiAlias=1
