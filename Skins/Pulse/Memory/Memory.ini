[Variables]
Label=Memory
@Include=#@#Card.inc

[Used]
Measure=PhysicalMemory
UpdateDivider=#Tick#

[Total]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[Pct]
Measure=Calc
Formula=Used / Total * 100
MinValue=0
MaxValue=100
UpdateDivider=#Tick#

[DetailText]
Measure=String
String=[Used:/1073741824,1] of [Total:/1073741824,1] GB
DynamicVariables=1
UpdateDivider=#Tick#

[TopProc]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=1
UpdateDivider=#Tick#

[TopText]
Measure=String
String=[TopProc:/1073741824,1] GB · [TopProc]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^.* · $":"Nothing busy"
UpdateDivider=#Tick#
