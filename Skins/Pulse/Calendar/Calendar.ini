; Calendar card: wide (2 units + gap by 1 unit). Scroll to change month; click the left side for today. Today on the left; this month's grid on the
; right with today circled in the accent. Grid geometry (x from 112, 18 per column, rows from
; y 27 every 14.5) matches TodayDot below; Calendar.lua fills it when the date changes.

[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!SetTransparency #Opacity#]
MouseOverAction=[!SetVariable Edge "#EdgeHover#"][!UpdateMeter Bg][!Redraw]
MouseLeaveAction=[!SetVariable Edge "#EdgeIdle#"][!UpdateMeter Bg][!Redraw]
MouseScrollUpAction=[!CommandMeasure Grid "Shift(-1)"]
MouseScrollDownAction=[!CommandMeasure Grid "Shift(1)"]
LeftMouseDoubleClickAction=["outlookcal:"]
ContextTitle=Open Calendar
ContextAction=["outlookcal:"]

[Variables]
@Include=#@#Theme.inc
Accent=122,184,255
TodayCol=0
ViewMonth=
TodayA=255
; Month-change animation (Calendar.lua): grid opacity and vertical offset.
GridA=255
GridDY=0
TodayRow=0
