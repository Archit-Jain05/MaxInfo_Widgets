[FirstDay]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Control Panel\International
RegValue=iFirstDayOfWeek
UpdateDivider=-1

[Weekday]
Measure=Time
Format=%A

[DayNum]
Measure=Time
Format=%#d

; ~200 ms month-change animation, then a 150 ms pause before the wheel is listened to again.
[Anim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Frame, 16, 12 | Wait 150 | Unlock
Unlock=[!CommandMeasure Grid "Unlock()"]
Frame=[!CommandMeasure Grid "Frame()"]

[Grid]
Measure=Script
ScriptFile=#@#Calendar.lua

; Apple-style corner outline for the card background (sets #CardPath# once).
[Squircle]
Measure=Script
ScriptFile=#@#Squircle.lua
Width=((2*#Unit#+#Gap#)*#S#)
Height=(#Unit#*#S#)
Radius=(#Radius#*#S#)
UpdateDivider=-1

[Bg]
Meter=Shape
Shape=Path CardShape | Fill Color #Ground# | StrokeWidth 1 | Stroke Color #Edge#
CardShape=#CardPath#
DynamicVariables=1

; Clicking the today side returns the grid to the current month.
[TodayHit]
Meter=Shape
Shape=Rectangle 0,0,(100*#S#),(120*#S#) | Fill Color 255,255,255,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure Grid "Shift(0)"]

[WeekdayText]
Meter=String
MeasureName=Weekday
FontFace=#FontSemi#
FontSize=(8*#S#)
FontColor=#Accent#
X=(14*#S#)
Y=(12*#S#)
AntiAlias=1

[DayText]
Meter=String
MeasureName=DayNum
FontFace=#FontNumber#
FontSize=(36*#S#)
FontColor=#Ink#
X=(10*#S#)
Y=(18*#S#)
InlineSetting=CharacterSpacing | 0 | -3
AntiAlias=1

[MonthText]
Meter=String
Text=#ViewMonth#
DynamicVariables=1
FontFace=#Font#
FontSize=(8*#S#)
FontColor=#Muted#
X=(14*#S#)
Y=(90*#S#)
AntiAlias=1

; The days and today's circle sit in GridBox so the month change can fade/slide them.
[GridBox]
Meter=Shape
Y=(#GridDY#*#S#)
Shape=Rectangle (104*#S#),(24*#S#),(148*#S#),(96*#S#) | Fill Color 255,255,255,#GridA# | StrokeWidth 0
DynamicVariables=1

[TodayDot]
Meter=Shape
Container=GridBox
Shape=Ellipse ((112+(#TodayCol#+0.5)*18)*#S#),((34+#TodayRow#*14.5)*#S#),(7*#S#) | Fill Color #Accent#,#TodayA# | StrokeWidth 0
DynamicVariables=1

